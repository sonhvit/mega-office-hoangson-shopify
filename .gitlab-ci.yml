check_commit_msg:
  stage: commit_check
  tags:
    - docker
  image:
    name: $IMAGE_NAME
    pull_policy: 'if-not-present'
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == 'true'
      exists:
        - commitlint.config.js
  script:
    - npx commitlint --from $CI_MERGE_REQUEST_DIFF_BASE_SHA --to $CI_COMMIT_SHA

check_commit_author:
  stage: commit_check
  tags:
    - docker
  image:
    name: $IMAGE_NAME
    pull_policy: 'if-not-present'
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == 'true'
      exists:
        - COMMIT_AUTHOR
  script:
    - |
      echo "Check commit author"
      echo "Step 1/2"
      LIST_AUTHOR="$(npx git-raw-commits --from $CI_MERGE_REQUEST_DIFF_BASE_SHA --to $CI_COMMIT_SHA --pretty=format:"%ae")"
      while IFS= read -r commitline; do
          FLAG_TRUE=0
          while read -r line; do
              if [[ "$commitline" == *"$line"* ]]; then
                  FLAG_TRUE=1
              fi
          done < COMMIT_AUTHOR
          if [ "$FLAG_TRUE" == "0" ]; then
              echo "This commit is not allow: $commitline"
              echo "Allow list"
              cat COMMIT_AUTHOR
              exit 1
          fi
      done <<< "$LIST_AUTHOR"
      echo "Done"

      echo "Step 2/2"
      LIST_COMMIT="$(npx git-raw-commits --from $CI_MERGE_REQUEST_DIFF_BASE_SHA --to $CI_COMMIT_SHA --pretty=format:"%ce")"
      while IFS= read -r commitline; do
          FLAG_TRUE=0
          while read -r line; do
              if [[ "$commitline" == *"$line"* ]]; then
                  FLAG_TRUE=1
              fi
          done < COMMIT_AUTHOR
          if [ "$FLAG_TRUE" == "0" ]; then
              echo "This commit is not allow: $commitline"
              echo "Allow list"
              cat COMMIT_AUTHOR
              exit 1
          fi
      done <<< "$LIST_COMMIT"
      echo "Done"

      exit 0;
  allow_failure: true
